name: Build and Test

on:
  push:
    branches: [master, develop]
    paths: ["bleak/**", "tests/**", ".github/workflows/build_and_test.yml", "pyproject.toml"]
  pull_request:
    paths: ["bleak/**", "tests/**", ".github/workflows/build_and_test.yml", "pyproject.toml"]
  workflow_dispatch:

jobs:
  build_desktop:
    name: "Build and test"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["310", "311", "312", "313", "314"]
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Test with pytest
        run: uv run poe test-py${{ matrix.python-version }} --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Type checking
        # We don't do this in the lint job because we have conditionals
        # on both the platform and the Python version in the code, so we
        # need to check each matrix combination.

        run: |
          uv run poe typecheck

  integration_tests_bluez:
    name: "BlueZ integration tests"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils qemu-kvm

      - name: Enable KVM group permissions
        run: |
          sudo chmod 666 /dev/kvm

      - name: Build and boot Alpine VM
        run: ./.github/alpine-vm/start-alpine-vm.sh

      - name: Run pytest in VM
        run: |
          ./.github/alpine-vm/vm-ssh.sh '
            bluetoothctl --version
            export UV_PROJECT_ENVIRONMENT=../.venv  # We are in an mounted folder, so to speed things up put the venv outside the mount
            export FORCE_COLOR=1
            export CI=true
            export GITHUB_ACTIONS=true
            uv run poe test-py${{ matrix.python-version }} --bleak-vhci --cov-report=xml --cov-report=html:../.htmlcov --junitxml=junit.xml -o junit_family=legacy -o cache_dir=../.pytest_cache
          '

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          flags: bluez-integration-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          flags: bluez-integration-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # The same integration tests against the Windows Bluetooth stack, using the
  # winvhci driver in place of BlueZ's vhci. No VM: GitHub's Windows runner
  # images enable test signing at image build time, so the driver installs
  # directly on the runner.
  integration_tests_winvhci:
    name: "Windows integration tests"
    # Must be a Windows CLIENT image, and ARM64 is the only one GitHub offers.
    # Windows Server is not supported: Microsoft does not document Bluetooth
    # as supported there, and windows-2025 still ships bthport.sys and
    # bthenum.sys at the RTM 10.0.26100.1 while the rest of the OS is serviced
    # to .33296. A GATT discovery failure reproduced 19 times in 448 tests
    # there and 0 times in 448 here. The vs2026 label is pinned because the
    # plain windows-11-arm label is being migrated to this image anyway.
    runs-on: "windows-11-vs2026-arm"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["310", "311", "312", "313", "314"]
    steps:
      - uses: actions/checkout@v4

      # Installs the driver but deliberately not a radio: the radio's lifetime
      # is a device handle's lifetime, so winvhci_controller.py owns it.
      - name: Install the winvhci driver
        uses: dlech/windows-vhci-driver/actions/install@v1.3.0
        with:
          # Keep equal to the ref above. A mismatch surfaces as
          # ERROR_INVALID_FUNCTION from an IOCTL, not as a version complaint.
          version: v1.3.0

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Run pytest
        env:
          FORCE_COLOR: 1
        run: uv run poe test-py${{ matrix.python-version }} --bleak-vhci --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          flags: winvhci-integration-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          flags: winvhci-integration-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration_tests_android:
    name: "Android integration tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [
          "3.13",
          # some binary dependencies of bumble are not yet available for 3.14, like cryptography or aiohttp
          # "3.14"
        ]
        api-level: [31, 33]
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Setup Environment
        run: |
          # Use GitHub's preinstalled JDK 17 for Android builds
          echo JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME_17_arm64}" | tee -a ${GITHUB_ENV}
          # Enable KVM permissions for the Android emulator as recommended in
          # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/briefcase
            ~/.gradle/wrapper/dists
            ~/.gradle/caches
            /usr/local/lib/android/sdk/cmdline-tools/19.0
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-${{ matrix.api-level }}
          key: build-deps-${{ runner.os }}-api${{ matrix.api-level }}-${{ hashFiles('testbed/pyproject.toml') }}
          restore-keys: |
            build-deps-${{ runner.os }}-api${{ matrix.api-level }}-

      - name: Run App
        run: uv run testbed/run_android_tests_emulator.py --ci --api-level ${{ matrix.api-level }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: coverage
          flags: android-integration-py${{ matrix.python-version }}-api${{ matrix.api-level }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          flags: android-integration-py${{ matrix.python-version }}-api${{ matrix.api-level }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Type checking
        # We don't do this in the lint job because we have conditionals
        # on both the platform and the Python version in the code, so we
        # need to check each matrix combination.
        run: |
          # For pyright a new release is missing that includes https://github.com/microsoft/pyright/pull/11221
          # When building pyright from main locally, it works.
          # uv tool install pyright
          # uv run pyright --project pyrightconfig-android.json
          uv tool install mypy
          uv run mypy --config-file=mypy-android.ini
